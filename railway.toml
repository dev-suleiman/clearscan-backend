[build]
builder = "dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"

[[services]]
name = "clearscan-api"

  [services.variables]
  PORT = "8000"
  MODEL_DIR = "/model_files"
  CORS_ORIGINS = "*"
  LOG_LEVEL = "INFO"
